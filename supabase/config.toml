# Supabase CLI configuration for local development (`npx supabase start`).
# Only settings that differ from the CLI defaults are listed.
project_id = "camino"

[api]
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
site_url = "http://localhost:3000"
# Web callback + native deep link used by Capacitor (see docs/mobile.md).
additional_redirect_urls = [
  "http://localhost:3000/auth/callback/",
  "http://localhost:3000/auth/nueva-contrasena/",
  "camino://auth/callback",
  "camino://auth/nueva-contrasena",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
minimum_password_length = 8

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true

# Google/Apple are configured in M1. Secrets come from env, never from this file.
[auth.external.google]
enabled = false
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"

[auth.external.apple]
enabled = false
client_id = "env(SUPABASE_AUTH_APPLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_APPLE_SECRET)"

[storage]
file_size_limit = "10MiB"
