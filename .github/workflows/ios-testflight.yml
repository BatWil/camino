name: iOS TestFlight

# Archives the app and uploads it to App Store Connect (TestFlight) with automatic signing.
# Repository secrets (never committed):
#   APPLE_TEAM_ID                  10-character Team ID
#   ASC_KEY_ID, ASC_ISSUER_ID      App Store Connect API key (role: App Manager)
#   ASC_KEY_P8_BASE64              base64 of the AuthKey_XXXX.p8 file
#   NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY (anon key only)
# Repository variables: NEXT_PUBLIC_APP_URL, CAMINO_APP_HOST.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version_name:
        description: "Versión visible (p. ej. 1.0.0)"
        required: true
        default: "1.0.0"

permissions:
  contents: read

jobs:
  testflight:
    runs-on: macos-15
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Version (tag v1.2.0 → 1.2.0)
        env:
          RAW: ${{ github.event.inputs.version_name || github.ref_name }}
        run: echo "VERSION_NAME=${RAW#v}" >> "$GITHUB_ENV"
      - name: Check secrets
        env:
          KEY: ${{ secrets.ASC_KEY_P8_BASE64 }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$KEY" ] || [ -z "$TEAM" ]; then echo "::error::App Store Connect secrets are not configured"; exit 1; fi
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - run: npx cap sync ios
      - name: Restore App Store Connect key (temporary file)
        env:
          KEY: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: echo "$KEY" | base64 --decode > "$RUNNER_TEMP/asc.p8"
      - name: Archive
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination "generic/platform=iOS" -archivePath "$RUNNER_TEMP/Camino.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="$VERSION_NAME" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CAMINO_APP_HOST="${{ vars.CAMINO_APP_HOST }}" \
            -allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/asc.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER" \
            archive | tail -30
      - name: Upload to TestFlight
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM}</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Camino.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/asc.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER" | tail -30
      - name: Remove secrets from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/asc.p8"
