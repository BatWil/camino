name: Android release

# Builds a signed AAB (Play Store) and APK (sideload / physical-device testing).
# Runs on version tags (v1.2.0) or manually. All credentials come from repository secrets:
#   ANDROID_KEYSTORE_BASE64            base64 of the upload keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#   GOOGLE_SERVICES_JSON_BASE64        optional — enables push (FCM)
#   NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY (anon key only, never service_role)
# and repository variables: NEXT_PUBLIC_APP_URL, CAMINO_APP_HOST, ANDROID_SHA256_CERT_FINGERPRINTS.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version_name:
        description: "Versión visible (p. ej. 1.0.0)"
        required: true
        default: "1.0.0"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production
    env:
      # Monotonic: every run gets a higher versionCode than the last.
      CAMINO_VERSION_CODE: ${{ github.run_number }}
      CAMINO_APP_HOST: ${{ vars.CAMINO_APP_HOST }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Version name (tag v1.2.0 → 1.2.0)
        env:
          RAW: ${{ github.event.inputs.version_name || github.ref_name }}
        run: echo "CAMINO_VERSION_NAME=${RAW#v}" >> "$GITHUB_ENV"
      - name: Check signing secrets
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then echo "::error::ANDROID_KEYSTORE_BASE64 is not configured"; exit 1; fi
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          ANDROID_SHA256_CERT_FINGERPRINTS: ${{ vars.ANDROID_SHA256_CERT_FINGERPRINTS }}
      - run: npx cap sync android
      - name: Restore signing key and Firebase config (temporary files)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GS: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          echo "$KS" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          if [ -n "$GS" ]; then echo "$GS" | base64 --decode > android/app/google-services.json; fi
      - name: Build signed AAB and APK
        working-directory: android
        env:
          CAMINO_ANDROID_KEYSTORE: ${{ runner.temp }}/upload.jks
          CAMINO_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CAMINO_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CAMINO_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease assembleRelease
      - name: Verify APK signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs android/app/build/outputs/apk/release/app-release.apk | head -5
      - name: Remove secrets from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks" android/app/google-services.json
      - uses: actions/upload-artifact@v4
        with:
          name: camino-${{ env.CAMINO_VERSION_NAME }}-${{ github.run_number }}
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
