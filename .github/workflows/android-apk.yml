name: Android APK (prueba)

# Builds an installable debug APK and publishes it as a GitHub pre-release with a direct download link.
# Debug-signed: for testing on phones (allow "install unknown apps"). Play Store builds use android-release.yml.
# Supabase values below are the PUBLIC client config (publishable key, same as in the web bundle);
# repository secrets with the same names override them. service_role is never used here.

on:
  push:
    branches: ["claude/camino-christian-platform-ivlzj3"]
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://sjshodalwikotzizxtwk.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_SA7acaK0Ff6cGi9-B9eyQQ_52NEiIrL' }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL || 'https://camino-steel.vercel.app' }}
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        env:
          CAMINO_VERSION_CODE: ${{ github.run_number }}
          CAMINO_VERSION_NAME: 0.${{ github.run_number }}-prueba
        run: ./gradlew assembleDebug --no-daemon
      - name: Publish pre-release with the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk camino.apk
          TAG="apk-${{ github.run_number }}"
          gh release create "$TAG" camino.apk --target "${{ github.sha }}" --prerelease \
            --title "Camino · APK de prueba #${{ github.run_number }}" \
            --notes "APK de prueba (firma debug) del commit ${{ github.sha }}. En Android: descarga camino.apk, ábrelo y permite instalar apps de esta fuente."
      - uses: actions/upload-artifact@v4
        with:
          name: camino-apk-${{ github.run_number }}
          path: camino.apk
          retention-days: 14
